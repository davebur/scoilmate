# nginx reverse proxy for ScoilMate, HTTPS version. Needs nginx 1.25.1 or newer (for `http2 on;`).
# Installed by deploy/install-ubuntu.sh only once the certificate exists. Replace scoilmate.example.ie with your domain.
# Certificate: sudo certbot certonly --nginx -d scoilmate.example.ie

limit_req_zone $binary_remote_addr zone=scoilmate_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name scoilmate.example.ie;
    # Keep the certificate renewal challenge on HTTP; redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scoilmate.example.ie;

    ssl_certificate     /etc/letsencrypt/live/scoilmate.example.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoilmate.example.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 64k;          # answers and admin forms are small
    client_body_timeout 10s;
    proxy_read_timeout 30s;

    # Security headers. The app also sends a strict CSP; nginx adds HSTS for HTTPS only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "same-origin" always;

    # Gentle brute-force brake on the login form (the app also rate-limits per account and IP).
    location = /login {
        limit_req zone=scoilmate_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scoilmate-proxy.conf;
    }

    # Static branding and CSS/JS: cache for a day; the files are versioned by deploys.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scoilmate-proxy.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scoilmate-proxy.conf;
    }
}
