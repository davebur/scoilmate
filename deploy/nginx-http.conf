# Bootstrap nginx site: used only until the HTTPS certificate exists. Serves the Let's Encrypt
# challenge and proxies the app over plain HTTP so the site can be checked before HTTPS is set up.
# The install script replaces this with nginx-https.conf once the certificate is in place.
server {
    listen 80;
    listen [::]:80;
    server_name scoilmate.example.ie;
    server_tokens off;
    client_max_body_size 64k;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scoilmate-proxy.conf;
    }
}
